<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncScreen - WebRTC远程控制</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 { font-size: 32px; margin-bottom: 10px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .content { padding: 30px; }
    .section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }
    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .status-waiting { background: #ffc107; color: #000; }
    .status-connected { background: #4caf50; color: white; }
    .status-error { background: #f44336; color: white; }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin: 5px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover:not(:disabled) { background: #5568d3; }
    .btn-success { background: #4caf50; color: white; }
    .btn-danger { background: #f44336; color: white; }
    .btn-warning { background: #ff9800; color: white; }
    .qr-container {
      text-align: center;
      padding: 20px;
      background: white;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }
    .room-id-display {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-top: 15px;
    }
    .room-id-value {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
      letter-spacing: 3px;
      margin: 15px 0;
      user-select: all;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .video-wrapper {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .video-label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
    }
    .chat-box {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      height: 300px;
      overflow-y: auto;
      padding: 15px;
      margin-bottom: 15px;
    }
    .chat-message {
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
    }
    .chat-message.me {
      background: #667eea;
      color: white;
      margin-left: auto;
      text-align: right;
    }
    .chat-message.other {
      background: #f0f0f0;
      color: #333;
    }
    .chat-message.system {
      background: #fff3cd;
      color: #856404;
      text-align: center;
      max-width: 100%;
      font-size: 13px;
    }
    .input-group {
      display: flex;
      gap: 10px;
    }
    .input-group input {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    .control-canvas {
      border: 2px solid #667eea;
      border-radius: 12px;
      cursor: crosshair;
      max-width: 100%;
      background: #000;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    .tab {
      padding: 12px 24px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #666;
    }
    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🖥️ SyncScreen</h1>
      <p>WebRTC远程控制 · 屏幕共享 · 语音视频 · 实时聊天</p>
    </div>

    <div class="content">
      <div class="section">
        <h3>📡 连接状态</h3>
        <span id="status" class="status-badge status-waiting">正在初始化...</span>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('host')">🏠 创建房间</button>
        <button class="tab" onclick="switchTab('join')">🔗 加入房间</button>
      </div>

      <div id="tab-host" class="tab-content active">
        <div class="section">
          <h3>🏠 创建房间</h3>
          <button id="createRoomBtn" class="btn btn-primary">创建房间并生成二维码</button>

          <div id="roomDisplay" style="display:none;">
            <div class="room-id-display">
              <p style="color: #666; margin-bottom: 10px;">房间ID</p>
              <div id="roomIdValue" class="room-id-value"></div>
              <button id="copyRoomBtn" class="btn btn-success">📋 复制房间ID</button>
            </div>
            <div id="qrcode" class="qr-container"></div>
          </div>
        </div>
      </div>

      <div id="tab-join" class="tab-content">
        <div class="section">
          <h3>🔗 加入房间</h3>
          <div class="input-group">
            <input type="text" id="roomIdInput" placeholder="输入房间ID">
            <button id="joinRoomBtn" class="btn btn-primary">加入房间</button>
          </div>
        </div>
      </div>

      <div class="section" id="videoSection" style="display:none;">
        <h3>📹 媒体控制</h3>
        <div>
          <button id="startVideoBtn" class="btn btn-success">📹 开启视频</button>
          <button id="startAudioBtn" class="btn btn-success">🎤 开启语音</button>
          <button id="shareScreenBtn" class="btn btn-primary">🖥️ 共享屏幕</button>
          <button id="stopMediaBtn" class="btn btn-danger" disabled>⏹️ 停止</button>
          <button id="muteBtn" class="btn btn-warning" disabled>🔇 静音</button>
        </div>
        <div class="video-grid" id="videoGrid"></div>
      </div>

      <div class="section" id="controlSection" style="display:none;">
        <h3>🎮 远程控制</h3>
        <div>
          <button id="enableControlBtn" class="btn btn-primary">启用远程控制</button>
          <button id="disableControlBtn" class="btn btn-danger" disabled>禁用远程控制</button>
          <p style="margin-top: 10px; color: #666; font-size: 13px;">
            点击下方屏幕可发送触摸事件到对方设备
          </p>
        </div>
        <canvas id="controlCanvas" class="control-canvas" style="display:none;"></canvas>
      </div>

      <div class="section">
        <h3>💬 聊天</h3>
        <div id="chatBox" class="chat-box"></div>
        <div class="input-group">
          <input type="text" id="messageInput" placeholder="输入消息..." disabled>
          <button id="sendMessageBtn" class="btn btn-primary" disabled>发送</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
